name: Auto-Post Test Updates
on:
  push:
    branches:
      - test

permissions:
  contents: read
  discussions: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Post to Discussion Thread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Get commit title and body (patch notes)
          TITLE=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)

          # 2. Extract the version number (e.g., grabs "0.8.2" from "0.8.2 build 1")
          VERSION=$(echo "$TITLE" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$VERSION" ]; then
            echo "Could not find a version number in the title: $TITLE"
            exit 0
          fi

          TARGET_TITLE="$VERSION test builds"
          echo "Looking for discussion thread titled: $TARGET_TITLE"

          # 3. Search for the existing discussion thread
          DISCUSSIONS_JSON=$(gh discussion list --repo ${{ github.repository }} --category "General" --limit 100 --json number,title)
          
          # 4. Safely extract the discussion number
          DISCUSSION_NUMBER=$(echo "$DISCUSSIONS_JSON" | jq -r '.. | objects | select(.title == "'"$TARGET_TITLE"'") | .number' | head -n 1)

          # If the thread doesn't exist yet, create it automatically
          if [ -z "$DISCUSSION_NUMBER" ] || [ "$DISCUSSION_NUMBER" == "null" ]; then
            echo "Thread '$TARGET_TITLE' not found. Creating it now..."
            NEW_URL=$(gh discussion create --repo ${{ github.repository }} \
              --category "General" \
              --title "$TARGET_TITLE" \
              --body "Running list of test builds for version $VERSION.")
            
            # gh create outputs the URL. We grab the number at the end
            DISCUSSION_NUMBER=$(echo "$NEW_URL" | awk -F'/' '{print $NF}')
          fi

          # Final safety check before posting
          if [ -z "$DISCUSSION_NUMBER" ]; then
            echo "Critical Error: Could not determine Discussion Number."
            exit 1
          fi

          # 5. Find the updated .ipk files inside the dist/ folder
          MODERN_PATH=$(ls dist/*"${VERSION}"*webOS22*.ipk 2>/dev/null | head -n 1 || true)
          STD_PATH=$(ls dist/*"${VERSION}"*.ipk 2>/dev/null | grep -v "webOS22" | head -n 1 || true)

          # Extract just the filename for clean markdown link labels
          MODERN_NAME=$(basename "$MODERN_PATH" 2>/dev/null || true)
          STD_NAME=$(basename "$STD_PATH" 2>/dev/null || true)

          # 6. Construct the layout for the comment
          cat <<EOF > comment_body.md
          $TITLE - https://github.com/${{ github.repository }}/commit/${{ github.sha }}

          [$STD_NAME](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$STD_PATH?raw=true)
          
          [$MODERN_NAME](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$MODERN_PATH?raw=true)

          ### Patch Notes

          $BODY
          EOF

          # 7. Post the comment into the thread
          gh discussion comment $DISCUSSION_NUMBER --repo ${{ github.repository }} --body-file comment_body.md
          echo "Successfully posted to discussion thread #$DISCUSSION_NUMBER"
